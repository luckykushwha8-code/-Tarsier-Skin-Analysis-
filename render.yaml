services:
  - type: web
    name: tarsier-api
    env: node
    region: singapore
    plan: free
    rootDir: artifacts/api-server
    buildCommand: pnpm install && pnpm run build
    startCommand: node dist/index.cjs
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: PORT
        value: 10000
